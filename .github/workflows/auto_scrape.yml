name: Auto Weather & Image Scraper

on:
  # 1. 定时触发：每 15 分钟执行一次
  schedule:
    - cron: '*/15 * * * *'
  # 2. 手动触发：允许你在 GitHub 网页端 Actions 页面手动点击 "Run workflow" 测试
  workflow_dispatch: 

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码 (Checkout repository)
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装系统依赖 (Install Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: 4. 安装 Python 依赖 (Install Packages)
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas Pillow pytesseract opencv-python-headless openpyxl numpy

      - name: 5. 运行爬虫脚本 (Run Scraper)
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
        run: |
          # 进入你存放代码的文件夹
          cd 时刻爬取
          # 运行脚本
          python main.py

      - name: 6. 提交并推送数据 (Commit and Push Data)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 时刻爬取/data/
          # 智能判断：如果有文件变动，才执行 commit 和 push，避免无数据时报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: 抓取最新气象与图像数据" && git push)
